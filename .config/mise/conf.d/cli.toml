# --with=cli. On Git Bash, Scoop installs the comfort tools instead, so those
# are Linux-only here.
[tools]
fzf = { version = "latest", os = ["linux"] }
ripgrep = { version = "latest", os = ["linux"] }
jq = { version = "latest", os = ["linux"] }
bat = { version = "latest", os = ["linux"] }
fd = { version = "latest", os = ["linux"] }
delta = { version = "latest", os = ["linux"] }
neovim = { version = "latest", os = ["linux"] }
shellcheck = "latest"
# Required by mise's own shell completion: `mise completion bash` emits only a
# dispatcher that shells out to `usage` at completion time, so without this
# every <TAB> on `mise` prints an error. See .bashrc.d/70-completions.sh
usage = "latest"
