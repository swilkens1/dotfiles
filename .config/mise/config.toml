# Global mise config. Tools come from conf.d/*.toml, one file per bootstrap
# feature, so only selected features' tools get installed:
#   cli.toml         shell tools        (--with=cli)
#   aws.toml         AWS CLI            (--with=aws)
#   terraform.toml   IaC tools          (--with=terraform)
#   containers.toml  kubectl            (--with=containers)
# `mise use -g TOOL` adds to this file; commit it with dotsync to share it.
[tools]
